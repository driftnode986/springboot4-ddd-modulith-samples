# 補償が失敗して残った記録に気づくための設定（第15章と同じ 2 つ）。
# spring.profiles.active=staleness で有効になる。
# 見張りを既定で有効にしないのは、第15章の StalenessMonitorTest が
# 「時間を設定しなければ放置される」ことを確かめているため。
# #region events
spring:
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      staleness:
        published: 1m
        check-intervall: 1s
# #endregion
